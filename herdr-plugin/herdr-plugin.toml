id = "lynxy.model-gate"
name = "model-gate"
version = "0.2.0"
min_herdr_version = "0.7.5"
description = "Панель мониторинга model-gate (mgpan) как сайдбар herdr: висит во всех workspace, LIVE-запросы, бэкенды, графики, управление."
platforms = ["macos", "linux"]

# startup: развесить панель по всем workspace после старта/перезапуска сервера
[[startup]]
command = ["./ensure-panes.sh"]

# новый workspace — панель цепляется туда сама
[[events]]
on = "workspace.created"
command = ["./on-workspace.sh"]

# pane открывает mgrun: поднимет gate, если не поднят, и покажет панель
# (--no-gpu: экземпляров много, powermetrics каждый секунду слишком дорог)
[[panes]]
id = "mgpan"
title = "model-gate"
placement = "split"
command = ["./mgpan-pane.sh"]

[[actions]]
id = "toggle"
title = "Toggle model-gate panel"
description = "Закрыть панель в текущем workspace или открыть, если закрыта."
contexts = ["workspace"]
command = ["./toggle-pane.sh"]

[[actions]]
id = "open"
title = "Open model-gate panel"
description = "Открыть mgpan в split-панели текущего workspace."
contexts = ["workspace"]
command = ["./open-pane.sh"]

# prefix+g — открыть/закрыть панель (как prefix+l у лайаутов)
[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "lynxy.model-gate.toggle"
description = "toggle model-gate panel"
