name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - run: python -m py_compile mgrun mgpan model_gate/*.py
      - run: python -m json.tool model-gate.example.json > /dev/null
      - run: python -m pip install --no-deps --target "$RUNNER_TEMP/model-gate-install" .
      - run: cd "$RUNNER_TEMP" && PYTHONPATH="$RUNNER_TEMP/model-gate-install" "$RUNNER_TEMP/model-gate-install/bin/model-gate" --help
